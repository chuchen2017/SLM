data:
  city: US
  osm_dir: data/osm
  questions_dir: data/instruction_dataset
  benchmark_dir: data/benchmark
  # Counties are polygons. Length is omitted. Topology uses
  # data/osm/US/topo_relationships.json, split so a pair is trained only when
  # both counties are in training_data.gpkg.
  tasks: [area, distance, topology, nearest]
  samples_per_task: 2000
  area_decimals: 2
  distance_decimals: 0
  include_thinking: false

model:
  base_model: Qwen/Qwen3-8B
  geo_token: "<GEO>"
  # US self-embeddings are 512-d (location and shape). Leave null to read the width
  # from training_embeddings_self.npy.
  geo_input_dim: null
  geo_hidden_dim: 512
  geo_out_dim: 256
  geo_projector_hidden_dim: 2048
  torch_dtype: bfloat16
  gradient_checkpointing: true

lora:
  enabled: true
  r: 32
  alpha: 64
  dropout: 0.05
  freeze_base_model: true

runtime:
  cuda_visible_devices: null

train:
  output_dir: outputs/slm_us
  epochs: 3
  encoder_only_epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  geo_learning_rate_multiplier: 10.0
  mixed_precision: bf16
  eval_every_epochs: 1
  eval_num_samples: 32
  seed: 42

generation:
  batch_size: 8
  max_new_tokens: 64
  do_sample: false
